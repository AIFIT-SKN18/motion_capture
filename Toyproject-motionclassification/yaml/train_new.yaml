work_dir: /content/drive/MyDrive/motion seungok/fine-tuning/work_dir/ntu/xsub/agcn_joint
model_saved_name: /content/drive/MyDrive/motion seungok/fine-tuning/runs/ntu_cs_agcn_joint

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: /content/drive/MyDrive/motion seungok/fine-tuning_dataset/train_data_joint.npy
  label_path: /content/drive/MyDrive/motion seungok/fine-tuning_dataset/train_label.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

# (옵션) 테스트 세트가 따로 있으면 추가
# test_feeder_args:
#   data_path: ...
#   label_path: ...

# model
model: model.agcn.Model
model_args:
  num_class: 6            # ✅ 최종 클래스 수
  num_point: 25
  num_person: 1
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

# optim
weight_decay: 0.0001
base_lr: 0.1
step: [30, 40]

# training
device: [0]               # ✅ 단일 GPU 기본. 다중GPU 쓰려면 [0,1,...]로 두고 --device auto 사용
batch_size: 32
test_batch_size: 32
num_epoch: 20
nesterov: True
